<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 85" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&amp;family=Poppins:ital,wght@1,800;1,900&amp;display=swap');
      .brand-durtup {
        font-family: 'Poppins', 'Outfit', system-ui, -apple-system, sans-serif;
        font-weight: 900;
        font-style: italic;
        fill: #FFFFFF;
      }
      .brand-shop {
        font-family: 'Poppins', 'Outfit', system-ui, -apple-system, sans-serif;
        font-weight: 700;
        font-style: italic;
        fill: #FFFFFF;
        opacity: 0.95;
      }
    </style>
    <!-- Drop shadow for 3D depth matching the brand design -->
    <filter id="logo-shadow" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <g filter="url(#logo-shadow)" transform="translate(4, 2)">
    <!-- "Durtup" Text -->
    <text x="4" y="54" class="brand-durtup" font-size="56" letter-spacing="-1.5">Durtup</text>
    
    <!-- ".shop" Text -->
    <text x="208" y="54" class="brand-shop" font-size="34" letter-spacing="-0.5">.shop</text>
    
    <!-- Smooth Dynamic Smile Curve with Arrowhead -->
    <!-- Starts under 'D', curves down and up under 'urtup', ends with arrow pointing up-right -->
    <path d="M 12 62 C 60 82, 145 84, 212 59 C 208 61, 203 64, 199 69 L 212 59 L 206 48 C 208 53, 210 57, 212 59 Z" 
          fill="#FFFFFF" 
          stroke="#FFFFFF" 
          stroke-width="1.2" 
          stroke-linejoin="round" 
          stroke-linecap="round" />
  </g>
</svg>