<style>

    /* ====== CSS VARIABLES & RESET ====== */


    :root {
        --primary-color: #f97316;
        --common-gradient: linear-gradient(90deg, #ff6a00, #ff8c1a);
        --common-icon-bg: rgba(255, 122, 48, 0.12);
        --secondary-color: #10b981;
        --accent-color: #f97316;
        --dark-color: #1e293b;
        --light-color: #f8fafc;
        --gray-color: #64748b;
        --white: #ffffff;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        --radius: 16px;
        --transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.1);
        --container-width: 1200px;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }



    body {
        font-family: 'Noto Sans Bengali', 'Inter', sans-serif !important;
        background-color: var(--light-color);
        color: var(--dark-color);
        line-height: 1.6;
        overflow-x: hidden;
    }

    a {
        text-decoration: none;
        cursor: pointer;
    }

    .section-padding {
        padding: 60px 0;
    }

    .section-title {
        text-align: center;
        margin-bottom: 30px;
        position: relative;
    }

    .section-title h2 {
        font-size: 2rem;
        font-weight: 700;
        color: var(--dark-color);
        margin-bottom: 16px;
        position: relative;
        display: inline-block;
    }

    .section-title h2::after {
        content: '';
        position: absolute;
        bottom: -8px;
        left: 50%;
        transform: translateX(-50%);
        width: 80px;
        height: 4px;
        background: var(--common-gradient);
        border-radius: 2px;
    }

    .section-title p {
        font-size: 1.125rem;
        color: var(--gray-color);
        max-width: 700px;
        margin: 0 auto;
    }

    /* =========== Auth Part Start ========== */

    .auth-area {
        background: #f8f9fa;
        display: flex;
        align-items: center;
    }

    .auth-card {
        max-width: 420px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 14px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
    }

    .auth-card-body {
        padding: 40px 35px;
    }

    .auth-header {
        text-align: center;
        margin-bottom: 30px;
    }

    .auth-logo {
        max-height: 60px;
        width: auto;
    }

    .auth-title {
        font-size: 22px;
        font-weight: 600;
        color: #1f2937;
        margin-bottom: 8px;
        font-family: system-ui;
    }

    .auth-header p {
        font-size: 14px;
        color: #555;
        font-family: system-ui;
    }

    .auth-subtitle {
        font-size: 14px;
        color: #6b7280;
    }

    .auth-subtitle a {
        color: var(--primary-color);
        font-weight: 500;
        text-decoration: none;
    }

    .auth-form .form-group {
        margin-bottom: 18px;
    }

    .form-label {
        font-size: 14px;
        font-weight: 500;
        margin-bottom: 5px;
        display: block;
        color: #374151;
    }

    .auth-input {
        height: 46px;
        border-radius: 8px;
        border: 1px solid #d1d5db;
        font-size: 14px;
    }

    .auth-input:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(255, 140, 26, 0.15);
    }

    .auth-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 25px;
    }

    .forgot-link {
        font-size: 13px;
        color: #6b7280;
        text-decoration: none;
    }

    .forgot-link:hover {
        color: var(--primary-color);
    }

    .primary-btn {
        padding: 10px 26px;
        border-radius: 10px;
        border: none;
        font-size: 14px;
        font-weight: 600;
        color: #ffffff;
        background: var(--common-gradient);
        transition: all 0.35s ease;
        cursor: pointer;
    }

    .primary-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 28px rgba(255, 122, 26, 0.55);
    }

    .primary-btn:disabled {
        opacity: 0.7;
        cursor: not-allowed;
    }

    .auth-form .form-group:last-child {
        margin-bottom: 0;
    }


    /* =========== Auth Part End ========== */

    /* ====== HERO SECTION ====== */
    .hero-section {
        width: 100%;
        overflow: hidden;
    }

    .hero-slide {
        display: block;
    }

    .hero-section-banner {
        width: 100%;
        max-width: 100%;
        max-height: calc(100vh - 80px);
        display: block;
        object-fit: cover;
    }

    /* ====== SECTION 2: USP BAR  ====== */
    .usp-section {
        background: #eef3f8;
        position: relative;
    }

    .usp-container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 0 20px;
    }


    .usp-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 30px;
    }

    .usp-item {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        border-radius: var(--radius);
        padding: 32px 24px;
        text-align: center;
        transition: var(--transition);
        border: 1px solid #e0e7ff;
        position: relative;
        overflow: hidden;
    }

    .usp-item::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 2px;
        background: var(--common-gradient);
        transform: scaleX(0);
        transition: transform 0.3s ease;
    }

    .usp-item:hover {
        transform: translateY(-8px);
        box-shadow: var(--shadow);
        border-color: #e0e7ff;
    }

    .usp-item:hover::before {
        transform: scaleX(1);
    }

    .usp-icon {
        width: 60px;
        height: 60px;
        margin: 0 auto 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        transition: var(--transition);
        position: relative;
    }

    .usp-item:nth-child(1) .usp-icon {
        background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
        color: #0284c7;
    }

    .usp-item:nth-child(2) .usp-icon {
        background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
        color: #ca8a04;
    }

    .usp-item:nth-child(3) .usp-icon {
        background: linear-gradient(135deg, #faf5ff 0%, #f3e8ff 100%);
        color: #7c3aed;
    }

    .usp-item:nth-child(4) .usp-icon {
        background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
        color: #059669;
    }

    .usp-icon i {
        font-size: 20px;
    }

    .usp-item:hover .usp-icon {
        transform: scale(1.1) rotate(5deg);
    }

    .usp-item h3 {
        font-size: 1.25rem;
        font-weight: 600;
        color: var(--dark-color);
        margin-bottom: 12px;
    }

    .usp-item p {
        color: var(--gray-color);
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 20px;
    }

    .usp-badge {
        display: inline-block;
        padding: 6px 16px;
        background: rgba(59, 130, 246, 0.1);
        color: var(--primary-color);
        border-radius: 20px;
        font-size: 0.875rem;
        font-weight: 600;
        transition: var(--transition);
    }

    .usp-item:hover .usp-badge {
        transform: translateY(-2px);
    }

    /* ====== DROPSHIPPING SERVICE SECTION ====== */
    .dropshipping-service-section {
        background: #fff;
        position: relative;
    }

    .service-content-wrapper {
        display: grid;
        gap: 30px;
    }

    .service-details-card {
        background: var(--white);
        border-radius: var(--radius);
        padding: 40px;
        box-shadow: var(--shadow);
        border: 1px solid rgba(59, 130, 246, 0.1);
    }

    .service-header h2 {
        font-size: 2rem;
        font-weight: 700;
        color: var(--dark-color);
        margin-bottom: 16px;
        line-height: 1.3;
    }

    .title-highlight {
        color: var(--primary-color);
        position: relative;
    }

    .benefits-grid {
        display: grid;
        gap: 30px;
        margin: 30px 0;
        grid-template-columns: 1fr 1fr;
    }

    .benefit-item {
        display: flex;
        align-items: flex-start;
        gap: 20px;
        padding: 20px;
        background: #f8fafc;
        border-radius: 12px;
        transition: var(--transition);
        border: 1px solid #e0e7ff;
    }

    .benefit-item:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 25px rgba(59, 130, 246, 0.15);
        border-left-color: var(--primary-color);
        background: var(--white);
    }

    .benefit-icon-wrapper {
        width: 60px;
        height: 60px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }

    .benefit-icon {
        font-size: 20px;
    }

    /* 1️⃣ Sky / Trust */
    .benefit-item:nth-child(1) .benefit-icon-wrapper {
        background: linear-gradient(135deg, #f0f9ff, #e0f2fe);
        color: #0284c7;
    }

    /* 2️⃣ Amber / Support */
    .benefit-item:nth-child(2) .benefit-icon-wrapper {
        background: linear-gradient(135deg, #fffbeb, #fef3c7);
        color: #ca8a04;
    }

    /* 3️⃣ Violet / Quality */
    .benefit-item:nth-child(3) .benefit-icon-wrapper {
        background: linear-gradient(135deg, #faf5ff, #f3e8ff);
        color: #7c3aed;
    }

    /* 4️⃣ Emerald / Security */
    .benefit-item:nth-child(4) .benefit-icon-wrapper {
        background: linear-gradient(135deg, #ecfdf5, #d1fae5);
        color: #059669;
    }

    .benefit-content h4 {
        font-size: 1.125rem;
        font-weight: 600;
        margin-bottom: 8px;
        color: var(--dark-color);
    }

    .benefit-content p {
        color: var(--gray-color);
        font-size: 0.95rem;
        margin-bottom: 0;
    }

    .additional-benefits {
        display: grid;
        gap: 30px;
        margin: 30px 0;
        grid-template-columns: auto auto auto;
    }

    .benefit-badge {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        background: rgba(59, 130, 246, 0.1);
        border-radius: 30px;
        color: var(--primary-color);
        font-weight: 500;
        font-size: 0.875rem;
        transition: var(--transition);
        width: 100%;
        justify-content: center;
    }

    .benefit-badge:hover {
        background: rgba(59, 130, 246, 0.2);
    }

    .cta-section {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        grid-gap: 30px;
    }

    .join-reseller-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: var(--common-gradient);
        color: var(--white);
        padding: 16px 32px;
        font-size: 1rem;
        font-weight: 600;
        border-radius: 12px;
        text-decoration: none;
        transition: var(--transition);
        width: 100%;
        border: none;
        cursor: pointer;
    }

    .join-reseller-btn:hover {
        transform: translateY(-3px);
    }

    .registered-users {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        color: var(--gray-color);
        font-size: 0.95rem;
        padding: 15px;
        background: #f8fafc;
        border-radius: 10px;
        border: 1px dashed #cbd5e1;
    }

    .video-card {
        background: var(--white);
        border-radius: var(--radius);
        padding: 30px;
        box-shadow: var(--shadow);
        border: 1px solid rgba(59, 130, 246, 0.1);
        position: sticky;
        top: 20px;
    }

    .video-header i {
        color: var(--primary-color);
    }

    .video-wrapper {
        border-radius: 12px;
        overflow: hidden;
        position: relative;
    }

    .video-container {
        position: relative;
        padding-bottom: 56.25%;
        height: 0;
        overflow: hidden;
    }

    .responsive-video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: none;
    }

    /* ====== CATEGORIES SECTION ====== */
    .categories-section {
        background: #fff;
    }

    .category-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 10px;
    }

    .category-item {
        background: var(--white);
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid #e2e8f0;
        transition: var(--transition);
        cursor: pointer;
        text-align: center;
    }

    .category-item:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        border-color: var(--primary-color);
    }

    .category-item a {
        text-decoration: none;
        color: inherit;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 10px;
    }

    .category-img {
        width: 70px;
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 15px;
    }

    .category-img img {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }

    .category-name h3 {
        font-size: 13px;
        font-weight: 600;
        color: var(--dark-color);
        margin: 0;
    }

    /* ====== COMPANY INFO ====== */
    .company-info-section {
        background: #eef3f8;
    }

    .info-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 30px;
    }

    .info-card {
        background: var(--white);
        border-radius: var(--radius);
        padding: 35px 20px;
        text-align: center;
        border: 1px solid #e2e8f0;
        transition: var(--transition);
    }

    .info-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.08);
    }

    .icon-box {
        width: 60px;
        height: 60px;
        background-color: var(--common-icon-bg);
        color: var(--primary-color);
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        margin: 0 auto 20px;
        font-size: 20px;
    }


    .info-card h3 {
        font-size: 2.5rem;
        font-weight: 800;
        color: var(--primary-color);
        margin-bottom: 8px;
    }

    .info-card p {
        font-size: 0.95rem;
        font-weight: 500;
        color: var(--gray-color);
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    /* ====== WHY CHOOSE US ====== */
    .why-choose-section {
        background: #eef3f8;
        position: relative;
        overflow: hidden;
    }

    .features-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 30px;
    }

    .feature-card {
        background: var(--white);
        padding: 36px 28px;
        border-radius: var(--radius);
        transition: var(--transition);
        text-align: center;
        border: 1px solid #e2e8f0;
        position: relative;
        overflow: hidden;
    }

    .feature-card:hover {
        transform: translateY(-10px);
        box-shadow: 0 20px 40px rgba(59, 130, 246, 0.12);
    }

    .feature-card::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 2px;
        background: var(--common-gradient);
        transform: scaleX(0);
        transition: transform 0.5s ease;
    }

    .feature-card:hover::after {
        transform: scaleX(1);
    }

    .feature-icon {
        width: 60px;
        height: 60px;
        margin: 0 auto 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 18px;
        font-size: 20px;
        transition: var(--transition);
    }

    .feature-card:hover .feature-icon {
        transform: scale(1.1) rotate(5deg);
    }


    .feature-card:nth-child(1) .feature-icon {
        background: linear-gradient(135deg, #f0f9ff, #e0f2fe);
        color: #0284c7;
    }

    .feature-card:nth-child(2) .feature-icon {
        background: linear-gradient(135deg, #fffbeb, #fef3c7);
        color: #ca8a04;
    }

    .feature-card:nth-child(3) .feature-icon {
        background: linear-gradient(135deg, #faf5ff, #f3e8ff);
        color: #7c3aed;
    }

    .feature-card:nth-child(4) .feature-icon {
        background: linear-gradient(135deg, #ecfdf5, #d1fae5);
        color: #059669;
    }

    .feature-card h3 {
        font-size: 1.375rem;
        font-weight: 700;
        color: var(--dark-color);
        margin-bottom: 16px;
    }

    .feature-card p {
        color: var(--gray-color);
        margin-bottom: 20px;
    }

    .feature-list {
        text-align: left;
        list-style: none;
        margin-top: 20px;
    }

    .feature-list li {
        padding: 8px 0;
        color: var(--gray-color);
        display: flex;
        align-items: center;
        font-size: 0.95rem;
    }

    .feature-list li i {
        color: var(--secondary-color);
        margin-right: 10px;
        font-size: 14px;
    }

    /* ====== TESTIMONIALS ====== */
    .testimonials-section {
        background: #eef3f8;
    }

    .testimonials-section .owl-stage {
        display: flex;
    }

    .testimonial-card {
        background: var(--white);
        padding: 30px;
        border-radius: var(--radius);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.03);
        border: 1px solid #e2e8f0;
        transition: var(--transition);
        height: 100%;
    }

    .testimonial-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
    }

    .stars {
        color: #fbbf24;
        font-size: 1.25rem;
        margin-bottom: 15px;
    }

    .profile-area {
        display: flex;
        align-items: center;
        margin-bottom: 20px;
    }

    .profile-img {
        width: 70px !important;
        height: 70px !important;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid var(--white);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        margin-right: 15px;
    }

    .name-info h3 {
        margin: 0 0 5px;
        color: var(--dark-color);
        font-size: 1.25rem;
    }

    .name-info p {
        margin: 0;
        color: var(--accent-color);
        font-size: 0.9rem;
        font-weight: 600;
    }

    .testimonial-card .content {
        color: var(--gray-color);
        line-height: 1.8;
        font-size: 1rem;
    }

    /* ====== SERVICES SECTION ====== */
    .services-section {
        background: #fff;
    }

    .services-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 30px;
    }

    .service-card {
        background: var(--white);
        border-radius: var(--radius);
        padding: 20px;
        text-align: center;
        box-shadow: var(--shadow);
        border: 1px solid #e2e8f0;
        transition: var(--transition);
